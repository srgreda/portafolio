<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Lista de Tareas</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fuentes e iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="app-container">
    <!-- Encabezado -->
    <header class="app-header">
      <div>
        <h1>Mis Tareas, gredaDeidad ✨</h1>
        <p id="current-date" class="subtitle"></p>
      </div>
      <div class="stats-badge" id="stats-badge">0 pendientes</div>
    </header>

    <!-- Entrada de nueva tarea -->
    <form id="todo-form" class="todo-form">
      <input type="text" id="todo-input" placeholder="¿Que tienes planeado hoy pibe?..." autocomplete="off" required />
      <button type="submit" id="add-btn">
        <span>Agregar</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </form>

    <!-- Barra de filtros -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">Todas</button>
      <button class="filter-btn" data-filter="pending">Pendientes</button>
      <button class="filter-btn" data-filter="completed">Completadas</button>
    </div>

    <!-- Lista de tareas -->
    <ul id="todo-list" class="todo-list">
      <!-- Se llenará dinámicamente con JavaScript -->
    </ul>

    <!-- Estado vacío -->
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">🎉</div>
      <p>¡No tienes tareas pendientes!</p>
      <span>Agrega una nueva tarea arriba para empezar.</span>
    </div>

    <!-- Pie con acciones adicionales -->
    <footer class="app-footer">
      <span id="task-counter">0 tareas en total</span>
      <button id="clear-completed-btn" class="clear-btn">Limpiar completadas</button>
    </footer>
  </div>

  <!-- Librería externa para animación de confeti 🎉 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
